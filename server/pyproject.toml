[project]
name = "pkg-mcp"
version = "0.1.0"
description = "MCP server that gives Claude long-term memory as a Neo4j knowledge graph"
authors = [
    { name = "Park Sang Min", email = "sm0104224@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.1",
    "neo4j>=6.4.1",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
pkg-mcp = "pkg_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers[neo4j]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers Neo4j)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Pydantic copies tool-argument defaults, so mutable defaults in signatures are safe there.
ignore = ["B006", "RUF001", "RUF002", "RUF003"]
