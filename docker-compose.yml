# Neo4j + the MCP server in HTTP mode, both bound to localhost.
#   ./scripts/quickstart.sh          creates .env with random secrets, then runs this
#   docker compose up -d --wait neo4j   Neo4j only, for the stdio server or tests
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp:
    build: ./server # built locally, so it runs on amd64 and arm64 alike
    ports:
      - "127.0.0.1:8000:8000" # http://localhost:8000/mcp
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-} # the server refuses to start without one
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j-data:
