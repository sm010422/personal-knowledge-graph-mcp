# TEMPLATE ONLY — never commit real values. Create the real Secret with kubectl:
#
#   NEO4J_PASSWORD=$(openssl rand -hex 24)
#   kubectl create secret generic personal-kg-secrets -n personal-kg \
#     --from-literal=NEO4J_PASSWORD="$NEO4J_PASSWORD" \
#     --from-literal=NEO4J_AUTH="neo4j/$NEO4J_PASSWORD" \
#     --from-literal=MCP_AUTH_TOKEN="$(openssl rand -hex 32)"
#
# See docs/deployment.md for rotation.
apiVersion: v1
kind: Secret
metadata:
  name: personal-kg-secrets
  namespace: personal-kg
type: Opaque
stringData:
  NEO4J_PASSWORD: "<random>"
  NEO4J_AUTH: "neo4j/<same random>"
  MCP_AUTH_TOKEN: "<openssl rand -hex 32>"
  # MCP_AUTH_TOKEN_NEXT: "<only during rotation>"
